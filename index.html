et een vreemde — de cassière, iemand in de lift, een medereiziger. Aan het einde van de week tel je niet hoeveel van die gesprekjes leuk of interessant waren. Je telt alleen of je de drie hebt uitgevoerd. Heb je dat gedaan? Dan was de week een succes, ongeacht hoe de gesprekken zelf verliepen. Dat is een fundamenteel andere maatstaf dan de meeste mannen gewend zijn te hanteren, en precies daarom werkt hij: hij verlegt succes van iets dat je niet controleert naar iets dat je wel controleert."},{"t":"p","x":"Pas als een bepaalde trede na verloop van tijd nauwelijks nog spanning oplevert, is het tijd om door te schuiven naar de volgende. Er is geen vaste tijdlijn hiervoor — voor de één is dat na een week, voor de ander na een maand. Het tempo doet er minder toe dan de consistentie. Vijf kleine pogingen verspreid over vijf weken bouwen uiteindelijk meer op dan één grote poging gevolgd door weken van niets doen."},{"t":"p","x":"Houd er ook rekening mee dat er weken zullen zijn waarin zelfs de kleinste actie te veel voelt. Dat is geen mislukking — het is een normaal onderdeel van elk proces waarin je jezelf blootstelt aan iets ongemakkelijks. Op zulke momenten helpt het om de lat tijdelijk te verlagen in plaats van helemaal te stoppen: als de geplande actie te zwaar voelt, kies dan voor de eenvoudigste versie ervan, of een tree lager op de ladder. Iets kleins blijven doen houdt de gewoonte levend. Volledig stoppen laat het hele fundament weer inzakken, en dan begin je bij de volgende poging weer bij nul."},{"t":"p","x":"In het volgende hoofdstuk verleggen we de aandacht van het vinden en benaderen van iemand, naar wat er gebeurt zodra er al een relatie is: hoe angst zich daar vermomt als jaloezie, controle en onzekerheid — en hoe dezelfde principes uit dit boek ook daar houvast bieden."}]},{"n":8,"title":"Angst in relaties: jaloezie, controle en onzekerheid","items":[{"t":"p","x":"Ze noemt terloops een collega met wie ze veel lacht op kantoor, en er trekt iets samen in je borst dat groter is dan de opmerking rechtvaardigt. Ze reageert wat later dan normaal op je berichtje, en meteen is daar de oude vraag weer: is er iets aan het veranderen? Je hebt een relatie, iets waar de vorige hoofdstukken impliciet naartoe werkten — en toch is de angst niet verdwenen. Ze is alleen van gedaante veranderd."},{"t":"p","x":"Dit hoofdstuk gaat over die verandering: hoe dezelfde afwijzingsangst die het begin van dit boek beschreef, zich binnen een bestaande relatie herschikt tot jaloezie, controle en aanhoudende onzekerheid. Het goede nieuws is dat de onderliggende mechanismen dezelfde zijn als in de vorige hoofdstukken — wat hier geleerd wordt, bouwt direct voort op wat al is opgebouwd."},{"t":"p","x":"Waarom de angst niet verdwijnt zodra je een relatie hebt Er bestaat een hardnekkig misverstand dat een relatie de angst voor afwijzing oplost — eindelijk gekozen zijn zou de onzekerheid moeten laten verdwijnen. In de praktijk verschuift de angst meestal alleen van doel. Vóór de relatie was de vraag: zal ze mij kiezen? Binnen de relatie wordt de vraag: zal ze mij blijven kiezen? Het onderliggende mechanisme — de angst om niet goed genoeg te zijn — is identiek."},{"t":"p","x":"Alleen het tijdsbestek verandert: van een enkel moment naar een voortdurende, nooit definitief afgesloten vraag."},{"t":"p","x":"Dit verklaart waarom sommige mannen, eenmaal in een relatie, juist onzekerder worden in plaats van rustiger. Zolang er niets te verliezen was, voelde de angst abstract. Zodra er iets waardevols op het spel staat, krijgt diezelfde angst een concreet doelwit om zich op te richten — en dat doelwit is meestal groter en dichterbij dan ooit tevoren."},{"t":"p","x":"Er is nog een reden waarom dit voor veel mannen als een verrassing komt: de periode van verkering en de eerste maanden van een relatie voelen vaak juist geruststellend, omdat er voortdurend nieuwe bevestiging binnenkomt — berichten, aandacht, groeiende intimiteit. Naarmate een relatie ouder wordt en die stroom van expliciete bevestiging vanzelfsprekend afneemt — niet omdat de liefde afneemt, maar omdat een relatie na verloop van tijd minder expliciet bevestigd hoeft te worden — interpreteert een angstig systeem die afname vaak verkeerd, als een teken dat er iets mis is, in plaats van als een normaal teken van verdieping."},{"t":"p","x":"◆ INZICHT Een relatie lost afwijzingsangst niet op — ze verandert de vraag van ‘zal ze mij kiezen’ naar ‘zal ze mij blijven kiezen’. Zonder het onderliggende patroon aan te pakken, blijft de angst gewoon meeverhuizen."},{"t":"h","x":"Jaloezie als gemaskeerde angst"},{"t":"p","x":"Jaloezie wordt vaak gepresenteerd als bewijs van liefde — hoe meer je geeft om iemand, hoe jaloerser je zou worden. Deze framing verwart twee dingen die duidelijk te onderscheiden zijn: oprechte betrokkenheid, en angst voor verlies. Jaloezie is zelden een teken van diepe liefde. Het is meestal een teken van diepe onzekerheid over de eigen positie in de relatie."},{"t":"p","x":"De opmerking over een collega die harder aankomt dan hij zou moeten, het onaangename gevoel bij een foto met een vriendengroep, de neiging om een naam die vaker terugkomt in het gesprek nauwlettend te volgen — dit zijn geen tekenen dat je te veel geeft om haar. Het zijn tekenen dat een deel van je gevoel van eigenwaarde nog steeds afhankelijk is van haar aandacht, precies het patroon dat in hoofdstuk 3 werd beschreven, nu toegepast op een situatie waarin er al een relatie bestaat."},{"t":"p","x":"Dit betekent niet dat elk gevoel van jaloezie een teken van een dieper probleem is. Een korte, voorbijgaande steek bij een dubbelzinnige situatie is menselijk en vraagt geen introspectie van uren. Het verschil met problematische jaloezie zit in de intensiteit en de duur: gaat het gevoel binnen enkele minuten weer liggen zodra de context duidelijk is, of blijft het uren of dagen doorwoekeren, gevoed door steeds nieuwe interpretaties? Het eerste is een normale menselijke reactie. Het tweede is het patroon dat dit hoofdstuk probeert te doorbreken."},{"t":"h","x":"Controle: de illusie van veiligheid"},{"t":"p","x":"Waar jaloezie het gevoel is, is controle vaak het gedrag dat erop volgt: vragen waar ze is en met wie, subtiel aandringen op meer updates gedurende de dag, een half oog houden op berichten of sociale media, situaties waarin ze contact heeft met andere mannen liever vermijden dan bespreken. Dit gedrag voelt in het moment als bescherming — als je maar genoeg weet, kan er niets onverwachts gebeuren."},{"t":"p","x":"De illusie zit in het woord ‘genoeg’. Er bestaat geen hoeveelheid informatie die de fundamentele onzekerheid van een relatie tussen twee vrije mensen kan wegnemen. Zij kan altijd, op elk moment, besluiten dat de relatie niet meer is wat ze wil. Geen enkele hoeveelheid controle verandert dat feit — het enige wat controle bereikt, is het gevoel van veiligheid tijdelijk nabootsen, terwijl het de ander langzaam het gevoel geeft dat ze steeds minder ruimte krijgt."},{"t":"p","x":"Controle heeft ook een langetermijneffect dat zelden wordt meegerekend: het verkleint geleidelijk de wereld van de relatie. Elke vriendengroep die wordt gemeden, elk contact dat wordt afgeremd, elke activiteit die liever niet zonder jou wordt ondernomen, snijdt een klein stukje van haar leven af — en op de lange termijn voelt dat niet als liefde, maar als een kooi die steeds kleiner wordt. De meeste mannen die dit patroon vertonen, zijn zich er niet van bewust hoe geleidelijk dit proces verloopt, precies omdat elke afzonderlijke stap zo klein en redelijk aanvoelt."},{"t":"p","x":"✎ REFLECTIE Herken je bij jezelf gedrag dat bedoeld is om meer zekerheid te krijgen over waar zij is, met wie, of wat ze voelt? Voelt dat gedrag voor jou als zorgzaamheid, of — eerlijk bekeken — meer als een poging om een onzeker gevoel bij jezelf te sussen?"},{"t":"h","x":"Een voorbeeld: hetzelfde moment, twee reacties"},{"t":"p","x":"Ze vertelt enthousiast over een borrel na het werk waar ook een mannelijke collega bij was met wie ze het goed kan vinden. Vanuit angst gestuurd, klinkt de reactie ongeveer zo: een korte stilte, een iets kortere reactie dan normaal, gevolgd later die avond door een paar terloopse vragen over die collega die net iets te gericht zijn om onopgemerkt te blijven. Niets wordt hardop beschuldigd, maar de spanning is voelbaar, en zij voelt zich zonder duidelijke reden ineens op haar hoede."},{"t":"p","x":"Vanuit zekerheid gestuurd, klinkt dezelfde situatie anders: oprechte interesse in het verhaal, misschien een lichte, eerlijk erkende steek van onzekerheid die je bij jezelf opmerkt maar niet meteen naar haar vertaalt in gedrag. Als de onzekerheid aanhoudt, wordt ze later rustig besproken, zonder verhoor en zonder verwijt. Het verschil tussen deze twee reacties zit niet in hoeveel je om haar geeft — in beide gevallen is dat evenveel. Het zit in of de angst het stuur overneemt, of dat jij dat doet."},{"t":"h","x":"Onzekerheid binnen een bestaande band"},{"t":"p","x":"De overdenk-patronen uit hoofdstuk 2 verdwijnen zelden zodra er een relatie is — ze verhuizen mee, alleen worden de vragen net iets anders. In plaats van ‘vindt ze me leuk’ wordt het ‘houdt ze nog steeds van me zoals in het begin’. In plaats van het analyseren van een enkel bericht, wordt het analyseren van de toon van een heel gesprek, op zoek naar tekenen van afkoeling die er misschien helemaal niet zijn."},{"t":"p","x":"Deze vorm van onzekerheid is bijzonder uitputtend omdat ze zich voordoet binnen iets dat juist veiligheid zou moeten bieden. Een relatie wordt dan niet de rustplaats die ze zou kunnen zijn, maar een voortdurende bron van monitoring — een tweede werk waarbij de taak is: blijf checken of het nog goed zit. Niemand houdt dat op de lange termijn vol zonder uitgeput te raken, en de partner die voortdurend gecheckt wordt, voelt die vermoeidheid vaak eerder aan dan degene die checkt zelf doorheeft."},{"t":"p","x":"◆ INZICHT Onzekerheid binnen een relatie oplossen door meer te checken, werkt averechts: het bevestigt tijdelijk, maar leert het zenuwstelsel dat checken nodig is om je veilig te voelen — waardoor de behoefte om te checken op termijn alleen maar groeit, in plaats van afneemt."},{"t":"p","x":"Wat jaloezie, controle en onzekerheid gemeen hebben Alle drie de patronen in dit hoofdstuk delen dezelfde onderliggende functie: een poging om onzekerheid over haar gevoelens te elimineren, in plaats van te leren die onzekerheid te dragen. Jaloezie probeert het via emotionele waakzaamheid. Controle probeert het via informatie verzamelen. Aanhoudende onzekerheid uit zich in eindeloos checken en overdenken. Geen van de drie lukt het ooit werkelijk, omdat het doel — volledige zekerheid over andermans gevoelens — principieel onbereikbaar is, precies zoals in hoofdstuk 2 werd beschreven."},{"t":"p","x":"Er schuilt een pijnlijke ironie in alle drie: het gedrag dat bedoeld is om de relatie te beschermen, is vaak precies wat haar op de proef stelt. Jaloezie legt druk op een partner die niets verkeerd heeft gedaan."},{"t":"p","x":"Controle beperkt de vrijheid die juist een teken van vertrouwen zou moeten zijn. Aanhoudend checken maakt duidelijk dat de relatie draait om het managen van jouw angst, in plaats van om twee mensen die elkaar de ruimte geven om zichzelf te zijn."},{"t":"p","x":"Er is een test die helpt om dit onderscheid scherp te krijgen: zou je het gedrag prettig vinden als zij het bij jou zou toepassen? Zou je het waarderen als zij jouw berichten controleerde, jouw vriendschappen beperkte, of jou uitvroeg over elk gesprek met een vrouwelijke collega? De meeste mannen antwoorden hier resoluut nee op — en die wederkerigheid is precies de graadmeter die vaak wordt vergeten zodra de angst het overneemt."},{"t":"p","x":"Deze wederkerigheidstoets werkt in bijna elke situatie waarin twijfel bestaat over of een handeling voortkomt uit liefde of uit angst. Liefde houdt in de regel rekening met wat de ander prettig vindt, ook als dat oncomfortabel is voor jezelf. Angst houdt vooral rekening met wat jouw onrust wegneemt, ongeacht hoe dat voor de ander aanvoelt. Het is geen toevallige samenloop dat de meest liefdevolle relaties vaak ook de relaties zijn met de minste controle — ruimte geven en vertrouwen hebben zijn geen tegenpolen van liefde, maar de praktische vorm die liefde aanneemt zodra angst niet langer het stuur vasthoudt."},{"t":"p","x":"✎ REFLECTIE Van de drie patronen — jaloezie, controle, aanhoudend checken — welke herken je het meest bij jezelf in een relatie? Wat zou er gebeuren als je die impuls een keer zou voelen, zonder erop te reageren?"},{"t":"h","x":"Hoe je zekerheid vindt zonder haar te controleren"},{"t":"p","x":"De uitweg uit dit hoofdstuk ligt niet in het vinden van meer bewijs dat ze van je houdt — dat bewijs is per definitie nooit genoeg, zoals eerder beschreven. De uitweg ligt in het versterken van precies de eigenwaarde die in hoofdstuk 3 centraal stond: een gevoel van waarde dat niet dagelijks bevestigd hoeft te worden door haar gedrag om overeind te blijven."},{"t":"p","x":"Concreet betekent dit: wanneer een golf van onzekerheid opkomt, jezelf eerst afvragen of er een feitelijke aanleiding is, of dat het een oud patroon is dat zich aandient. Als er een oprechte zorg is, bespreek die dan rechtstreeks met haar — niet als een verhoor, maar als een eerlijk gesprek: ‘ik merkte dat ik me onzeker voelde toen je het over die collega had, en ik wilde het even benoemen in plaats van het op te kroppen.’ Dit is kwetsbaarheid uit hoofdstuk 5 toegepast op een bestaande relatie — eerlijk zijn over een gevoel, zonder dat te verpakken als beschuldiging of eis."},{"t":"p","x":"Tot slot vraagt dit een bepaalde acceptatie die niet comfortabel is, maar wel nodig: een relatie biedt nooit volledige garantie. Elke relatie draagt een kwetsbaarheid die niet weg te controleren is, hoeveel moeite je er ook in steekt. Leren leven met die onzekerheid — in plaats van haar te bestrijden met controle — is precies wat een relatie op de lange termijn draaglijk en zelfs prettig maakt, voor beide partners."},{"t":"p","x":"Een laatste, praktisch hulpmiddel: als je merkt dat een van de drie patronen — jaloezie, controle, checken — actief is, vraag jezelf af welke concrete, feitelijke informatie je zou moeten hebben om je rustig te voelen. In bijna alle gevallen blijkt er geen antwoord op die vraag te zijn — geen hoeveelheid informatie zou volstaan, omdat het probleem niet ligt in een tekort aan informatie, maar in een tekort aan vertrouwen in jezelf om de onzekerheid te dragen. Die constatering alleen al kan genoeg zijn om de impuls tot checken of vragen even te laten voorbijgaan zonder ernaar te handelen."},{"t":"p","x":"In het volgende hoofdstuk gaan we in op een vaardigheid die hier direct bij aansluit: hoe je grenzen stelt en voor jezelf opkomt binnen een relatie, zonder daarbij hard of afstandelijk te worden — een balans die voor mannen met afwijzingsangst vaak net zo lastig is als loslaten van controle."},{"t":"p","x":"Beide vaardigheden — loslaten van controle, en grenzen stellen zonder hard te worden — delen dezelfde kern: een stevig gevoel van eigenwaarde dat niet afhangt van het managen van de ander. Zodra dat fundament sterker wordt, wordt het vanzelf makkelijker om zowel los te laten waar loslaten nodig is, als duidelijk te zijn waar duidelijkheid nodig is — twee kanten van dezelfde medaille, in plaats van twee tegenstrijdige opgaven."}]},{"n":9,"title":"Standing your ground zonder hard te worden","items":[{"t":"p","x":"Ze stelt voor om iets te doen waar je eigenlijk geen zin in hebt, en je zegt toch ja, om geen gedoe te veroorzaken. Dit gebeurt niet één keer, maar keer op keer, tot er ergens een grens wordt bereikt die je zelf niet had zien aankomen — en dan sla je door naar de andere kant: fel, afstandelijk, klaar om je eindelijk te verdedigen tegen iets dat allang had opgelost kunnen worden als je eerder iets had gezegd."},{"t":"p","x":"Dit hoofdstuk gaat over die twee uitersten, en over de ruimte ertussen die de meeste mannen met afwijzingsangst nooit hebben leren gebruiken: stevig voor jezelf opkomen, zonder toe te geven en zonder hard te worden. Deze vaardigheid — standvastigheid zonder scherpte — is misschien wel de meest directe test of alle voorgaande hoofdstukken daadwerkelijk beklijven, want ze vraagt om precies de stabiliteit die dit boek stap voor stap heeft opgebouwd."},{"t":"h","x":"De twee uitersten: toegeven en hard worden"},{"t":"p","x":"Mannen met afwijzingsangst bewegen zich vaak tussen twee polen die op het eerste gezicht tegenovergesteld lijken, maar in werkelijkheid uit dezelfde angst voortkomen. De eerste pool is toegeven: eigen voorkeuren wegcijferen, instemmen met dingen die je niet wilt, conflicten vermijden door simpelweg altijd mee te bewegen. Dit voelt als vriendelijkheid, als flexibel zijn — maar onder de oppervlakte zit vaak de angst dat een eigen mening of grens de relatie in gevaar brengt."},{"t":"p","x":"De tweede pool is hard worden: wanneer de opgekropte irritatie van te veel toegeven een uitweg zoekt, gebeurt dat zelden rustig. Het komt eruit als scherpte, kilte, of een plotselinge, disproportionele reactie op iets kleins — de spreekwoordelijke druppel. Ook dit voelt in het moment als bescherming: eindelijk grenzen stellen, eindelijk niet meer over je heen laten lopen. Maar de toon waarin het gebeurt, doet vaak meer schade dan de onderliggende boodschap nodig had."},{"t":"p","x":"Wat deze twee uitersten gemeen hebben, is dat geen van beide voortkomt uit een stabiele, rustige plek. Toegeven komt voort uit angst voor conflict. Hard worden komt voort uit diezelfde angst, alleen nadat de spanning te lang is opgebouwd om nog rustig te blijven. Beide zijn reacties op angst, niet uitingen van kracht — ook al voelt hard worden in het moment zelf vaak als het tegenovergestelde van zwak zijn."},{"t":"p","x":"◆ INZICHT Toegeven en hard worden lijken tegenpolen, maar zijn in werkelijkheid twee kanten van dezelfde angst: de een probeert conflict te vermijden door mee te bewegen, de ander probeert het te compenseren door uit te barsten. Geen van beide komt voort uit werkelijke stabiliteit."},{"t":"h","x":"Waarom grenzen voelen als risico"},{"t":"p","x":"Voor iemand met afwijzingsangst voelt een grens stellen — ‘nee, dat wil ik niet’, ‘ik ben het daar niet mee eens’, ‘dit werkt niet voor mij’ — als een directe bedreiging voor de relatie. De onderliggende gedachte is zelden expliciet, maar ligt ongeveer zo: als ik mijn eigen wensen laat gelden, bestaat de kans dat ze teleurgesteld raakt, boos wordt, of uiteindelijk besluit dat ik het niet waard ben om bij te blijven."},{"t":"p","x":"Deze angst is een direct uitvloeisel van de patronen uit de eerdere hoofdstukken: de afwijzingsangst uit hoofdstuk 1, de voorwaardelijke eigenwaarde uit hoofdstuk 3, allemaal bij elkaar opgeteld in het moment waarop een grens gesteld moet worden. Het resultaat is een man die liever zijn eigen wensen inslikt dan het risico te nemen dat een grens niet goed valt — ook al is de prijs daarvan, zoals in hoofdstuk 3 werd beschreven, uiteindelijk hoger dan het risico dat hij probeert te vermijden."},{"t":"p","x":"Wat er op het spel staat als je nooit standvastig wordt Het patroon van toegeven en af en toe hard worden heeft een prijs die zich niet in één moment laat zien, maar zich over jaren opstapelt. Een relatie waarin één persoon consequent zijn eigen voorkeuren wegcijfert, wordt langzaam scheef: de ander bepaalt, min of meer onbewust, steeds meer de richting, simpelweg omdat er nooit tegengeluid komt. Dit voelt in het begin misschien harmonieus, maar resulteert op termijn vaak in een relatie waarin de toegevende partner zichzelf kwijtraakt — en waarin de andere partner, vaak zonder dat te willen, steeds meer voor twee mensen tegelijk beslist."},{"t":"p","x":"Er is nog een ironisch gevolg: partners die altijd toegeven, worden op de lange termijn vaak minder aantrekkelijk gevonden, niet meer. Een relatie tussen twee gelijkwaardige mensen met eigen meningen en grenzen voelt over het algemeen levendiger en stabieler dan een relatie waarin één persoon zich voortdurend aanpast. Iemand die nooit tegenspreekt, wordt voorspelbaar op een manier die weinig ruimte laat voor de wrijving en groei die een relatie juist interessant houden."},{"t":"h","x":"Wat ‘hard worden’ probeert te compenseren"},{"t":"p","x":"Wanneer het toegeven te lang duurt, ontstaat er een tegenreactie die zelden mild is. Dit is een herkenbaar patroon: iemand die weken- of maandenlang zijn eigen grenzen heeft weggecijferd, ontploft uiteindelijk over iets kleins — niet omdat dat ene kleine ding zo ernstig is, maar omdat het de druppel is die een veel grotere, opgekropte lading laat overlopen."},{"t":"p","x":"Deze overcompensatie is in wezen dezelfde angst, nu uitgedrukt als aanval in plaats van onderwerping. Vechten en vluchten zijn allebei reacties op een bedreiging — het verschil zit niet in de onderliggende emotie, maar in de uiting ervan. Een man die hard wordt, voelt zich in dat moment vaak eindelijk sterk, terwijl hij in werkelijkheid nog steeds vanuit angst reageert, alleen nu in de aanvallende versie ervan in plaats van de onderdanige."},{"t":"p","x":"Er speelt hierbij nog een subtiel mechanisme: hard worden geeft op het moment zelf een gevoel van opluchting, vergelijkbaar met het openen van een lang opgehouden ventiel. Die opluchting wordt door het brein makkelijk verward met kracht of gelijk hebben, terwijl het in werkelijkheid gewoon de fysieke ontlading is van een spanning die al veel eerder een uitweg had moeten krijgen, in een kleinere en rustigere vorm. De opluchting bewijst niet dat de reactie gepast was — ze bewijst alleen dat er al lang druk aan het opbouwen was."},{"t":"p","x":"✎ REFLECTIE Denk aan een recent moment waarop je iets inslikte om geen gedoe te veroorzaken. Is die opgekropte irritatie later, bij een ander, minder belangrijk moment, er alsnog scherper uitgekomen dan de situatie rechtvaardigde?"},{"t":"h","x":"Wat standvastigheid daadwerkelijk is"},{"t":"p","x":"Tussen toegeven en hard worden ligt een derde optie die zelden vanzelf wordt aangeleerd: standvastigheid. Dit betekent een positie innemen en die rustig vasthouden, zonder de ander aan te vallen en zonder jezelf weg te cijferen. ‘Ik snap dat je dit graag anders zou zien, en toch blijf ik hierbij’ is een zin die geen van beide uitersten bevat — geen onderwerping, geen aanval, gewoon een duidelijke, rustige positie."},{"t":"p","x":"Wat standvastigheid onderscheidt van hard worden, is de afwezigheid van de behoefte om de ander te overtuigen, te straffen of te overheersen. Een standvastige man wil niet dat zij het met hem eens is — hij wil alleen duidelijk zijn over waar hij staat, en is bereid dat ongemak te accepteren als zij het er niet mee eens is. Dat is een fundamenteel andere houding dan hard worden, waarbij de impliciete boodschap vaak is: je moet nu inzien dat ik gelijk heb."},{"t":"p","x":"◆ INZICHT Standvastigheid vraagt niet om instemming van de ander. Ze vraagt alleen om duidelijkheid over je eigen positie, gecombineerd met de rust om te accepteren dat de ander het daar niet mee eens kan zijn."},{"t":"h","x":"Een voorbeeld: dezelfde situatie, drie reacties"},{"t":"p","x":"Stel: ze wil dit weekend bij haar familie doorbrengen, terwijl jij had gehoopt op een rustig weekend samen na een drukke werkweek. Toegevend klinkt het: ‘tuurlijk, geen probleem, we gaan wel weer een andere keer iets rustigs doen’ — terwijl de teleurstelling vanbinnen blijft hangen en zich misschien later ongemerkt uit in korte antwoorden of een sombere stemming die zij niet kan plaatsen."},{"t":"p","x":"Hard klinkt het: ‘we doen ook altijd maar wat jouw familie wil, ik heb ook wel eens ergens zin in’ — een reactie die meer zegt over opgekropte frustratie uit eerdere weekenden dan over dit specifieke weekend. Standvastig klinkt het: ‘ik snap dat je naar je familie wilt, en ik had zelf gehoopt op een rustig weekend samen — zullen we kijken of we een tussenweg vinden, of een ander moment voor het rustige weekend plannen?’ Dezelfde onderliggende wens, drie totaal verschillende uitwerkingen op de relatie."},{"t":"h","x":"De toon maakt het verschil"},{"t":"p","x":"Dezelfde boodschap kan op drie manieren worden overgebracht, met drie compleet verschillende uitwerkingen. Toegevend klinkt het zo: ‘ach, het is prima, we doen het gewoon zoals jij wilt’ — terwijl er van binnen weerstand is die nooit wordt uitgesproken. Hard klinkt het zo: ‘waarom moet het altijd op jouw manier, kun je niet één keer rekening houden met wat ik wil’ — beladen met verwijt en frustratie die zich al langer heeft opgebouwd. Standvastig klinkt het zo: ‘ik zou het liever anders doen, en dit is waarom — laten we kijken hoe we dat kunnen combineren met wat jij belangrijk vindt.’"},{"t":"p","x":"Het derde antwoord kost meer moed dan het eerste en meer zelfbeheersing dan het tweede. Het vraagt om het gevoel van ongemak te verdragen dat gepaard gaat met het innemen van een positie, zonder dat ongemak te laten omslaan in ofwel onderdanigheid ofwel agressie. Precies dat verdragen van ongemak — zonder eraan toe te geven op de ene of de andere manier — is de vaardigheid die dit hoofdstuk wil overbrengen."},{"t":"p","x":"✎ REFLECTIE Neem een grens die je recent had willen stellen maar niet stelde. Formuleer haar nu in de standvastige toon: duidelijk over je positie, zonder verwijt en zonder excuus. Hoe verschilt die zin van wat je destijds daadwerkelijk zei of dacht?"},{"t":"h","x":"Hoe je oefent met standvastig zijn"},{"t":"p","x":"Zoals bij zelfvertrouwen in hoofdstuk 7, werkt oefenen met standvastigheid het best via kleine, lage-risico situaties voordat je het toepast op grote, beladen onderwerpen. Begin met kleine voorkeuren: welk restaurant, welke film, hoe je weekend eruitziet. Zeg wat je echt wilt, in plaats van automatisch mee te bewegen met wat zij voorstelt. Deze kleine oefeningen bouwen de spier op die je nodig hebt voor de grotere momenten."},{"t":"p","x":"Let onderweg op twee automatische reflexen die de standvastigheid ondermijnen: overmatig verontschuldigen en overmatig uitleggen. Een grens die begint met ‘sorry, maar...’ en eindigt met drie alinea's rechtvaardiging, verliest haar kracht voordat ze goed en wel is uitgesproken. Een standvastige grens heeft geen overdreven verontschuldiging nodig en geen uitgebreide verdediging — een korte, duidelijke reden is voldoende. Meer uitleg voegt zelden meer overtuigingskracht toe; het voegt vooral meer ruimte toe voor twijfel."},{"t":"p","x":"Een oefening die veel mannen nuttig vinden: schrijf voor een aankomend, voorspelbaar lastig gesprek van tevoren de standvastige versie van je punt op, in niet meer dan twee zinnen. Lees die voor jezelf terug voordat het gesprek plaatsvindt. Dit voorkomt dat je in het moment zelf terugvalt op ofwel te veel toegeven, ofwel een emotionele uitbarsting — omdat je al hebt geoefend met de derde, kalmere versie voordat de spanning van het echte gesprek toeslaat."},{"t":"p","x":"Tot slot: leer haar teleurstelling of onenigheid te verdragen zonder die onmiddellijk te willen oplossen. Als je een grens stelt en zij is het er niet mee eens, is de instinctieve neiging om terug te krabbelen om de spanning te laten verdwijnen. Standvastigheid betekent juist blijven staan in die spanning — niet onaardig, niet star, maar rustig aanwezig, wetend dat onenigheid geen ramp is en niet meteen hoeft te worden opgelost."},{"t":"p","x":"In het laatste hoofdstuk brengen we alles uit dit boek samen tot een dagelijkse mindset en een aantal concrete rituelen — niet als een nieuwe checklist om af te vinken, maar als een manier om de onbevreesde houding die je hier hebt geoefend, blijvend te verankeren in hoe je je dagen doorbrengt."},{"t":"p","x":"Standvastigheid is misschien wel de meest zichtbare uiting van alles wat in dit boek is opgebouwd: de angst uit hoofdstuk 1, het overdenken uit hoofdstuk 2, de afhankelijke eigenwaarde uit hoofdstuk 3 — ze komen allemaal samen in het moment waarop je moet kiezen tussen jezelf wegcijferen en jezelf laten gelden. Elke keer dat je in dat moment de rustige, standvastige weg kiest in plaats van een van de twee uitersten, bevestig je opnieuw wat dit hele boek probeert te leren: dat je waarde niet op het spel staat, wat de uitkomst van dit ene gesprek ook is."},{"t":"p","x":"Onthoud dat dit hoofdstuk, net als de voorgaande, geen kwestie is van het aanleren van een script dat je perfect uitvoert. Er zullen momenten zijn waarop je toch toegeeft, of waarop de spanning toch scherper naar buiten komt dan je had gewild. Dat is geen falen — het is het normale verloop van een vaardigheid die tegen decennia van het tegenovergestelde in wordt opgebouwd. Elke poging, geslaagd of niet, telt mee in dezelfde geleidelijke opbouw die in hoofdstuk 7 werd beschreven."}]},{"n":10,"title":"De onbevreesde man — dagelijkse mindset en rituelen","items":[{"t":"p","x":"Aan het begin van dit boek stond een man die een onbeantwoord bericht las en binnen enkele minuten drie redenen had bedacht waarom hij niet goed genoeg was. Negen hoofdstukken verder is die man er, hopelijk, niet meer helemaal — er is inzicht bijgekomen, misschien al een paar geoefende momenten van kwetsbaarheid, wat minder overdenken, iets meer rust. Maar inzicht alleen houdt geen stand tegen jarenlange gewoontes, tenzij het iets wordt dat je dagelijks doet, niet iets dat je ooit hebt gelezen."},{"t":"p","x":"Dit laatste hoofdstuk gaat niet over nieuwe informatie. Het brengt alles wat voorafging samen tot iets dat werkt zonder dat je constant aan het boek hoeft te denken: een dagelijkse mindset, een paar concrete rituelen, en een manier om met terugval om te gaan zonder terug te vallen in de oude wanhoop die deze reis in de eerste plaats zo zwaar maakte."},{"t":"p","x":"Dit hoofdstuk sluit het boek af, maar niet het proces zelf. Waar de vorige negen hoofdstukken elk een specifiek onderdeel van het patroon blootlegden en aanpakten, gaat dit laatste hoofdstuk over het geheel: hoe je ervoor zorgt dat de afzonderlijke inzichten niet los van elkaar blijven staan, maar samensmelten tot één consistente manier van in de wereld staan — ook op de dagen waarop je dit boek allang niet meer bij de hand hebt."},{"t":"h","x":"Waarom inzicht niet vanzelf beklijft"},{"t":"p","x":"Een boek lezen en het begrijpen voelt vaak als vooruitgang, en dat is het ook — maar begrip en gedragsverandering zijn twee verschillende dingen, met een kloof ertussen die alleen door herhaling wordt overbrugd. Je kunt volledig doorzien dat afwijzing informatie is in plaats van een vonnis, en toch nog diezelfde steek van paniek voelen bij de volgende afwijzing — niet omdat het inzicht verkeerd was, maar omdat een zenuwstelsel dat jarenlang op één manier reageerde, niet in één keer overschakelt door alleen maar de juiste woorden te kennen."},{"t":"p","x":"Dit is geen reden voor ontmoediging. Het is precies waarom dit hoofdstuk bestaat: niet om nog meer te begrijpen, maar om een structuur te bieden waarin het begrepene, dag na dag, kan landen in gedrag. Herhaling was het mechanisme achter elk hoofdstuk in dit boek — van de kleine acties in hoofdstuk 7 tot het temperen van de innerlijke criticus in hoofdstuk 6. Dit hoofdstuk geeft die herhaling een vaste vorm."},{"t":"p","x":"◆ INZICHT Begrijpen is de eerste stap, niet de laatste. Een inzicht wordt pas een deel van wie je bent zodra het genoeg keer is toegepast om een nieuw automatisme te worden — en dat kost tijd, ongeacht hoe helder het inzicht zelf al is."},{"t":"h","x":"De rol van tijd in dit proces"},{"t":"p","x":"Een vraag die veel mannen zich stellen bij het einde van een boek als dit: hoelang duurt het voordat dit daadwerkelijk went? Er is geen universeel antwoord, maar de patronen uit de gedragswetenschap geven een indicatie: gewoontes die jarenlang zijn opgebouwd, vragen doorgaans maanden van consistente oefening voor ze plaatsmaken voor iets nieuws — niet omdat verandering traag is, maar omdat een zenuwstelsel nu eenmaal bewijs nodig heeft, en bewijs verzamel je alleen door herhaling, niet door vastberadenheid alleen."},{"t":"p","x":"Dit betekent niet dat er pas na maanden iets merkbaar wordt. De meeste mannen merken binnen enkele weken al verschil in kleine momenten — een sneller herstel na een afwijzing, een moment van kwetsbaarheid dat net iets makkelijker ging dan de vorige keer. Deze kleine verschuivingen zijn het bewijs dat het proces werkt, ook al is de grotere, stabielere verandering nog niet compleet. Let op deze kleine signalen in plaats van te wachten op een dag waarop alles ineens anders aanvoelt — die dag komt zelden, en de kleine signalen onderweg zijn wat echt telt."},{"t":"h","x":"De onbevreesde man: een korte samenvatting"},{"t":"p","x":"Voordat de dagelijkse praktijk aan bod komt, is het nuttig om de kern van elk hoofdstuk in een paar zinnen samen te vatten — niet als herhaling voor de herhaling zelf, maar omdat deze punten samen de mindset vormen die de rest van dit hoofdstuk probeert te verankeren."},{"t":"p","x":"Afwijzing is geen oordeel over je waarde, maar een datapunt over compatibiliteit. Overdenken lost onzekerheid niet op — het stelt de confrontatie ermee uit. Je eigenwaarde hoort te rusten op je eigen fundament, niet op haar reactie. Kwetsbaarheid, zonder behoeftigheid, is een kracht, geen zwakte. De innerlijke criticus is een stem, geen feit. Zelfvertrouwen ontstaat door te handelen, niet door te wachten tot het er is. Angst in een relatie verkleedt zich als jaloezie en controle. En standvastig zijn betekent stevig staan, zonder hard te worden."},{"t":"p","x":"Elk van deze punten is op zichzelf al bruikbaar. Samen vormen ze een consistente manier van in de wereld staan — niet vrij van angst, want die belofte doet dit boek nergens, maar vrij van de macht die angst voorheen had over wat je wel en niet durfde te doen."},{"t":"h","x":"Wat er concreet verandert in je dagelijks leven"},{"t":"p","x":"De veranderingen uit dit boek zijn abstract zolang ze alleen als ideeën bestaan. Concreet gemaakt, zien ze er ongeveer zo uit. In het daten: je stuurt een bericht zonder het vijf keer te herschrijven, en laat een stilte een stilte zijn in plaats van een raadsel dat om oplossing vraagt. Je durft een eerlijke mening te geven op een eerste date, in plaats van jezelf aan te passen aan wat je denkt dat aantrekkelijk overkomt."},{"t":"p","x":"Dit soort veranderingen lijken op zichzelf klein, en dat zijn ze ook — precies zoals hoofdstuk 7 beschreef. Het is de optelsom van tientallen van dit soort kleine momenten, verspreid over weken en maanden, die uiteindelijk het verschil maakt tussen een man die nog steeds wordt gestuurd door angst, en een man voor wie diezelfde angst er nog wel is, maar niet langer de doorslag geeft."},{"t":"p","x":"Deze verschuiving is voelbaar voor de mensen om je heen, ook al kunnen ze niet altijd precies benoemen wat er anders is. Vrienden merken iemand die directer communiceert. Een partner merkt iemand die minder vraagt om geruststelling en meer rust uitstraalt. En misschien nog het belangrijkst: jijzelf merkt het eerst, in de stille momenten waarop je een impuls van angst voelt opkomen en tegelijk merkt dat je er dit keer niet volledig door wordt meegesleept."},{"t":"p","x":"In een bestaande relatie: je merkt een golf van jaloezie op zonder er meteen naar te handelen, en bespreekt onzekerheid rechtstreeks in plaats van via controlerend gedrag. Je stelt een grens over iets dat je dwars zit, rustig en zonder overdreven verontschuldiging, in plaats van het op te kroppen tot het vanzelf naar buiten barst."},{"t":"p","x":"En breder dan alleen dating en relaties: je merkt de innerlijke criticus sneller op, op werk, in vriendschappen, in hoe je naar je eigen prestaties kijkt. Je onderneemt vaker kleine, ongemakkelijke acties, ook buiten de context van dit boek, omdat het patroon van klein beginnen en herhalen zich niet beperkt tot één levensgebied. Dit is precies waarom de kern van dit boek verder reikt dan de titel doet vermoeden: het gaat niet alleen om angst rond vrouwen, maar om een fundamenteel andere manier van jezelf in de wereld plaatsen."},{"t":"h","x":"Drie dagelijkse rituelen"},{"t":"p","x":"Om deze mindset te laten landen, zijn drie korte, dagelijkse gewoontes bruikbaarder dan een uitgebreid programma dat je toch niet volhoudt. Elk ritueel kost minder dan vijf minuten, en samen dekken ze het begin, het midden en het einde van je dag."},{"t":"p","x":"Het eerste is een ochtendritueel: bij het opstaan, kort bij jezelf nagaan welke angst vandaag waarschijnlijk gaat opspelen — overdenken, behoefte aan bevestiging, de neiging om toe te geven — en jezelf één zin meegeven die als tegenwicht dient. Niet als bezwering, maar als een korte herinnering aan wat je al weet, voordat de dag de kans krijgt om het te laten vergeten."},{"t":"p","x":"Het tweede is de micro-actie van de dag: één kleine, concrete handeling die aansluit bij de ladder uit hoofdstuk 7 — een compliment geven, een eerlijke mening delen, een grens stellen, een berichtje sturen zonder het vijf keer te herschrijven. Klein genoeg om altijd haalbaar te zijn, gericht genoeg om elke dag iets bij te dragen aan het fundament dat dit boek beschrijft."},{"t":"p","x":"Het derde is een avondreflectie: geen zelfkritische evaluatie van wat er misging, maar een eerlijke, neutrale terugblik — wat deed ik vandaag vanuit angst, en wat deed ik vandaag vanuit de persoon die ik probeer te worden? Deze vraag, gesteld zonder oordeel, bouwt precies het soort zelfbewustzijn op dat nodig is om patronen te herkennen voordat ze weer overnemen."},{"t":"p","x":"Deze drie rituelen werken het best als ze klein en licht blijven — geen uitgebreid dagboek, geen ellenlange meditatiesessie, geen ingewikkeld trackingsysteem. Het doel is een gewoonte die je ook op een drukke, vermoeiende dag nog volhoudt, want juist op die dagen valt men het snelst terug in oude patronen. Een gewoonte die alleen standhoudt op rustige dagen, is geen gewoonte — het is een goed voornemen dat wacht op de eerste tegenslag om te verdwijnen."},{"t":"p","x":"✎ REFLECTIE Van deze drie rituelen — ochtendintentie, micro-actie, avondreflectie — welke voelt het meest haalbaar om morgen al te beginnen? Begin daar, en voeg de andere twee pas toe zodra de eerste een gewoonte is geworden."},{"t":"h","x":"Wat te doen als je terugvalt"},{"t":"p","x":"Terugval is geen uitzondering op dit proces — het is een vast onderdeel ervan. Er zullen weken zijn waarin het overdenken weer de overhand krijgt, waarin je toch toegeeft uit angst voor conflict, waarin de innerlijke criticus harder klinkt dan in maanden. Dit betekent niet dat de voorgaande hoofdstukken niet hebben gewerkt. Het betekent dat je een mens bent die oude patronen afleert, en oude patronen laten zich zelden in een rechte lijn afleren."},{"t":"p","x":"Een bruikbaar protocol voor zo'n moment: herken eerst, zonder oordeel, welk patroon actief is — overdenken, afhankelijke eigenwaarde, controle, toegeven. Pas vervolgens de zelfcompassie uit hoofdstuk 6 toe in plaats van de criticus zijn gang te laten gaan over de terugval zelf. Kies daarna, zodra je kunt, één kleine actie uit hoofdstuk 7 om de opgebouwde stagnatie te doorbreken. Dit hoeft geen grote stap te zijn — het moet vooral een stap zijn, hoe klein ook."},{"t":"h","x":"Wanneer je hulp van buitenaf kunt overwegen"},{"t":"p","x":"Voor de meeste mannen is wat in dit boek staat voldoende om zelfstandig vooruitgang te boeken. Voor sommigen ligt de wortel van afwijzingsangst dieper — verweven met een moeilijke jeugd, een ingrijpende ervaring, of een patroon dat ondanks consistente oefening niet lijkt te verschuiven. Als dat herkenbaar is, is overwegen om met een therapeut of coach te werken geen teken van falen, maar een logische volgende stap. Dit boek biedt een raamwerk en concrete oefeningen; het vervangt geen professionele begeleiding wanneer die nodig is, en het is geen zwakte om dat onderscheid voor jezelf eerlijk te maken."},{"t":"p","x":"◆ INZICHT Terugval is geen bewijs dat het proces niet werkt. Het is een normaal onderdeel van elk proces waarin een oude gewoonte wordt afgeleerd. Wat telt, is niet of je terugvalt, maar hoe snel en hoe mild je jezelf weer op de rails krijgt."},{"t":"h","x":"De man die je aan het worden bent"},{"t":"p","x":"De onbevreesde man uit de titel van dit boek is geen man zonder angst in de letterlijke zin — niemand bereikt dat, en het is ook geen zinvol doel. Het is een man voor wie angst niet langer het stuur vasthoudt. Hij voelt onzekerheid voor een eerste bericht, en stuurt het toch. Hij voelt de steek van een afwijzing, en laat die steek voorbijgaan zonder dat ze zijn hele week bepaalt. Hij voelt de aandrang om te controleren, en kiest bewust voor vertrouwen in plaats daarvan."},{"t":"p","x":"Dit is geen eindpunt dat je op een dag definitief bereikt. Het is een richting waarin je jezelf, dag na dag, keer op keer, een stukje verder beweegt — soms met sprongen, soms met tegenslagen, maar per saldo steeds meer in de richting van iemand die zichzelf niet meer hoeft te bewijzen om zich goed genoeg te voelen. Dat is wat dit boek probeerde over te dragen: niet een truc om nooit meer afgewezen te worden, maar een fundament dat overeind blijft, wat de uitkomst ook is."},{"t":"p","x":"De laatste vraag van dit boek is niet gericht op wat je nu weet, maar op wat je morgen doet. Er is geen perfect moment om te beginnen — alleen dit moment, en de kleine, haalbare stap die erbij hoort. Dat is precies waar hoofdstuk 1 mee begon, en het is waar dit laatste hoofdstuk mee eindigt: niet met een gevoel dat eerst moet komen, maar met een handeling die je vandaag al kunt stellen."},{"t":"p","x":"Er is geen dramatisch afscheid nodig aan het einde van een boek als dit. Sluit het, kies de kleinste actie die vandaag nog haalbaar is, en voer die uit. De rest — het fundament, de rust, de man die minder gestuurd wordt door angst — volgt niet uit dit boek zelf, maar uit wat je vanaf morgen, dag na dag, daadwerkelijk gaat doen."}]}]}];
const synth = window.speechSynthesis;
const $ = id => document.getElementById(id);
let gen = 0, active = null, voices = [];

function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }

/* ---------- Stemmen ---------- */
const FEMALE = /colette|fenna|claire|ellen|female|vrouw|laura|sanne|lotte|emma/i;
const MALE = /maarten|xander|ruben|frank|bart|arthur|male|man\b|david|thijs|daan/i;
function isMale(v){ return MALE.test(v.name) && !FEMALE.test(v.name); }
function score(v){ return (isMale(v) ? 4 : FEMALE.test(v.name) ? 0 : 2) + (/nl-NL/i.test(v.lang) ? 1 : 0) + (/natural|online|neural/i.test(v.name) ? 1 : 0); }
function currentVoice(){ return voices[$('voice').value|0]; }
function voiceWarn(){
  const w = $('warn'), v = currentVoice();
  if(!synth){ w.style.display='block'; w.textContent='Deze browser kan niet voorlezen. Probeer Chrome, Edge of Safari.'; }
  else if(!voices.length){ w.style.display='block'; w.textContent='Er is geen Nederlandse stem gevonden op dit apparaat. Installeer er een in de spraakinstellingen, of open deze pagina in Microsoft Edge (daar zit de stem Maarten in).'; }
  else if(v && !isMale(v)){ w.style.display='block'; w.textContent='Dit is geen mannenstem. Kies hierboven een stem met \u201cman\u201d erachter, als die er is. Of open de pagina in Microsoft Edge voor de stem Maarten.'; }
  else w.style.display='none';
}
function loadVoices(){
  if(!synth) return voiceWarn();
  voices = synth.getVoices().filter(v => /^nl/i.test(v.lang));
  voices.sort((a,b) => score(b) - score(a));
  const sel = $('voice'); sel.innerHTML = '';
  voices.forEach((v,i) => { const o = document.createElement('option'); o.value = i; o.textContent = v.name + ' (' + v.lang + ')' + (isMale(v) ? ' \u2013 man' : ''); sel.appendChild(o); });
  const idx = voices.findIndex(v => v.name === store('mm_voice'));
  if(idx >= 0) sel.value = idx;
  voiceWarn();
}
if(synth){ loadVoices(); if(synth.addEventListener) synth.addEventListener('voiceschanged', loadVoices); } else voiceWarn();

function restartActive(){ if(active && active.playing) active.start(); }
$('voice').onchange = () => { const v = currentVoice(); if(v) store('mm_voice', v.name); voiceWarn(); restartActive(); };
$('rate').oninput = e => { $('rv').textContent = (+e.target.value).toFixed(1); store('mm_rate', e.target.value); };
$('rate').onchange = restartActive;
$('pitch').oninput = e => { $('pv').textContent = (+e.target.value).toFixed(1); };
$('pitch').onchange = restartActive;
const sr = store('mm_rate'); if(sr){ $('rate').value = sr; $('rv').textContent = (+sr).toFixed(1); }
window.addEventListener('beforeunload', () => { if(synth) synth.cancel(); });

/* ---------- Tekst in stukjes ---------- */
function makeChunks(ch){
  const out = [{t: 'Hoofdstuk ' + ch.n + '. ' + ch.title + '.', i: -1}];
  ch.items.forEach((it, ii) => {
    if(it.t === 'h'){ out.push({t: it.x.replace(/[?.!]?$/, '.'), i: ii}); return; }
    const sents = it.x.match(/[^.!?\u2026]+[.!?\u2026]+["\u201d\u2019\u00bb)]*\s*|[^.!?\u2026]+$/g) || [it.x];
    let buf = '';
    sents.forEach(s => {
      if((buf + s).length > 230 && buf){ out.push({t: buf.trim(), i: ii}); buf = ''; }
      buf += s;
    });
    if(buf.trim()) out.push({t: buf.trim(), i: ii});
  });
  return out;
}

/* ---------- Eén boek ---------- */
function createBook(b, bi){
  const sec = document.createElement('section');
  sec.className = 'book'; sec.id = 'boek-' + b.id;
  sec.innerHTML =
    '<h2 class="bt"></h2><p class="bs"></p>' +
    '<div class="player" role="region">' +
      '<div class="now"></div>' +
      '<div class="row">' +
        '<button class="prev" title="Vorig hoofdstuk" aria-label="Vorig hoofdstuk">&#9198;</button>' +
        '<button class="play main">&#9654; Afspelen</button>' +
        '<button class="stop" title="Stop" aria-label="Stop">&#9209; Stop</button>' +
        '<button class="next" title="Volgend hoofdstuk" aria-label="Volgend hoofdstuk">&#9197;</button>' +
      '</div>' +
      '<div class="bar" aria-hidden="true"><i></i></div>' +
    '</div>' +
    '<div class="chs"></div>' +
    '<p class="tip">Tip: klik op een stukje tekst om vanaf daar te luisteren.</p>' +
    '<article></article>' +
    '<a class="top" href="#top">&uarr; Naar boven</a>';
  sec.querySelector('.bt').textContent = b.title;
  sec.querySelector('.bs').textContent = b.sub + ' \u00b7 ' + b.chapters.length + ' hoofdstukken';
  const q = s => sec.querySelector(s);
  const play = q('.play'), now = q('.now'), prog = q('.bar i'), nav = q('.chs'), art = q('article');
  const me = { playing:false, ci:0, chunks:[], pos:0 };

  function label(){ play.innerHTML = me.playing ? '&#10074;&#10074; Pauze' : '&#9654; Afspelen'; }
  me.halt = () => { me.playing = false; label(); };
  function mark(scroll){
    art.querySelectorAll('.cur').forEach(e => e.classList.remove('cur'));
    const c = me.chunks[me.pos];
    if(c && c.i >= 0){ const el = art.querySelector('[data-i="' + c.i + '"]'); if(el){ el.classList.add('cur'); if(scroll) el.scrollIntoView({block:'center', behavior:'smooth'}); } }
    prog.style.width = (me.chunks.length ? Math.round(me.pos / me.chunks.length * 100) : 0) + '%';
  }
  function open(i, startChunk){
    if(me.playing){ gen++; if(synth) synth.cancel(); me.halt(); }
    me.ci = i; me.chunks = makeChunks(b.chapters[i]); me.pos = startChunk || 0;
    const ch = b.chapters[i];
    art.innerHTML = '';
    const h = document.createElement('h3'); h.className = 'ch'; h.textContent = ch.n + '. ' + ch.title; art.appendChild(h);
    ch.items.forEach((it, ii) => {
      const el = document.createElement(it.t === 'h' ? 'h4' : 'p');
      el.textContent = it.x; el.dataset.i = ii;
      el.onclick = () => { const k = me.chunks.findIndex(c => c.i === ii); me.pos = Math.max(0, k); me.start(); };
      art.appendChild(el);
    });
    [...nav.children].forEach(x => x.classList.toggle('on', +x.dataset.i === i));
    now.textContent = 'Hoofdstuk ' + ch.n + ' \u2013 ' + ch.title;
    store('mm_ch_' + b.id, i);
    mark(false);
  }
  me.start = () => {
    if(!synth) return;
    if(active && active !== me) active.halt();
    active = me; gen++; synth.cancel(); me.playing = true; label(); speak(gen);
  };
  function speak(g){
    if(g !== gen || !me.playing) return;
    if(me.pos >= me.chunks.length){
      if(me.ci + 1 < b.chapters.length){ open(me.ci + 1, 0); me.start(); }
      else { gen++; me.halt(); me.pos = 0; now.textContent = 'Einde van het boek'; }
      return;
    }
    mark(true);
    const c = me.chunks[me.pos];
    const u = new SpeechSynthesisUtterance(c.t);
    const v = currentVoice();
    if(v){ u.voice = v; u.lang = v.lang; } else u.lang = 'nl-NL';
    u.rate = +$('rate').value; u.pitch = +$('pitch').value;
    u.onend = () => { if(g === gen){ me.pos++; speak(g); } };
    u.onerror = e => { if(g === gen && e.error !== 'interrupted' && e.error !== 'canceled'){ me.pos++; speak(g); } };
    synth.speak(u);
  }
  play.onclick = () => {
    if(!synth) return;
    if(me.playing){ gen++; synth.cancel(); me.halt(); play.innerHTML = '&#9654; Verder'; }
    else me.start();
  };
  q('.stop').onclick = () => { gen++; if(synth) synth.cancel(); me.halt(); me.pos = 0; mark(false); };
  q('.prev').onclick = () => { const was = me.playing; open(Math.max(0, me.ci - 1), 0); if(was) me.start(); };
  q('.next').onclick = () => { const was = me.playing; open(Math.min(b.chapters.length - 1, me.ci + 1), 0); if(was) me.start(); };

  b.chapters.forEach((c, i) => {
    const x = document.createElement('button');
    x.textContent = c.n + '. ' + c.title.replace(/ [\u2014:].*$/, '').replace(/\(.*$/, '').trim();
    x.title = c.title; x.dataset.i = i;
    x.onclick = () => { open(i, 0); me.start(); };
    nav.appendChild(x);
  });
  open(Math.min(b.chapters.length - 1, Math.max(0, +(store('mm_ch_' + b.id) || 0))), 0);
  return sec;
}

const toc = $('toc'), host = $('books');
BOOKS.forEach((b, bi) => {
  const a = document.createElement('a'); a.href = '#boek-' + b.id;
  a.innerHTML = '<span></span>'; a.firstChild.textContent = 'Boek ' + (bi + 1) + ' \u00b7 ' + b.chapters.length + ' hoofdstukken';
  a.insertBefore(document.createTextNode(b.title), a.firstChild);
  toc.appendChild(a);
  host.appendChild(createBook(b, bi));
});
</script>
</body>
</html>
